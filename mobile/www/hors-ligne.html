<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pas de connexion</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; color: #0f172a; background: #f8fafc; text-align: center; padding: 24px; box-sizing: border-box; }
    .logo { display: block; width: 72px; height: 72px; margin: 0 auto 16px; }
    button { margin-top: 20px; padding: 12px 24px; border: 0; border-radius: 10px; background: #017c40; color: #fff; font: 600 16px system-ui, sans-serif; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="logo.png" alt="Jibiat Marchand">
    <h1 style="font-size:20px;margin:0 0 8px">Pas de connexion internet</h1>
    <p style="color:#475569;margin:0">Vérifiez vos données mobiles ou le Wi-Fi, puis réessayez.</p>
    <button type="button" onclick="history.length > 1 ? history.back() : location.reload()">Réessayer</button>
  </main>
</body>
</html>
