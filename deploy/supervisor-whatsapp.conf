; WhatsApp relié par QR code pour la boîte Messages (service whatsapp-bridge, Node).
; Copié dans /etc/supervisor/conf.d/__INSTANCE__-whatsapp.conf par lib.sh (install_whatsapp_bridge).
; __INSTANCE__, __APP_DIR__, __NODE__, __USER__ et __HOME__ sont remplacés à l'installation.
[program:__INSTANCE__-whatsapp]
process_name=%(program_name)s
command=__NODE__ __APP_DIR__/whatsapp-bridge/server.js
directory=__APP_DIR__/whatsapp-bridge
user=__USER__
environment=HOME="__HOME__",NODE_ENV="production"
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=20
redirect_stderr=true
stdout_logfile=__APP_DIR__/storage/logs/whatsapp-bridge.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
