# Jibiat Marchand sur un serveur Apache existant (ISPConfig) : la plateforme et toutes ses adresses
# __DOMAIN__, *.__DOMAIN__ (boutiques, admin., api.). Copié dans /etc/apache2/sites-available/ par install-apache.sh.
# ISPConfig ne gère pas ce fichier : il ne le modifie pas et n'a pas besoin d'en connaître l'existence.

<VirtualHost *:80>
    ServerName __DOMAIN__
    ServerAlias *.__DOMAIN__
    # Tout passe en HTTPS (sauf la validation des certificats, faite par DNS)
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName __DOMAIN__
    ServerAlias *.__DOMAIN__
    DocumentRoot __APP_DIR__/public

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/__DOMAIN__/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/__DOMAIN__/privkey.pem

    <Directory __APP_DIR__/public>
        Options +FollowSymLinks -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    # PHP-FPM dédié (utilisateur __USER__), voir php-fpm.conf
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php__PHP_V__-fpm-jibiat.sock|fcgi://jibiat-marchand"
    </FilesMatch>
    # En-tête Authorization transmis à PHP
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    # Photos du catalogue et fichiers compilés : mis en cache par les navigateurs
    <LocationMatch "^/(build|storage)/">
        Header set Cache-Control "public, max-age=2592000"
    </LocationMatch>

    LimitRequestBody 12582912
    ErrorLog ${APACHE_LOG_DIR}/jibiat-marchand-error.log
    CustomLog ${APACHE_LOG_DIR}/jibiat-marchand-access.log combined
</VirtualHost>
