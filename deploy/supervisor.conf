; Processus permanents de Jibiat Marchand (copié dans /etc/supervisor/conf.d/ par install-apache.sh).
; __INSTANCE__, __APP_DIR__, __PHP__, __USER__ et __HOME__ sont remplacés à l'installation.

; File d'attente « default » : messages WhatsApp, notifications, API Conversions de Meta, affectation automatique des
; livraisons, publications. Deux processus.
[program:__INSTANCE__-queue]
process_name=%(program_name)s_%(process_num)02d
numprocs=2
command=__PHP__ __APP_DIR__/artisan queue:work --queue=default --sleep=3 --tries=3 --max-time=3600
user=__USER__
environment=HOME="__HOME__"
autostart=true
autorestart=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=__APP_DIR__/storage/logs/queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

; File « long » (App\Jobs\Concerns\RunsLong) : exports, réponses de l'assistant du support, fiches produit par IA.
; Son propre processus : une tâche de plusieurs minutes ne retarde plus les messages WhatsApp. Connexion
; database-long (config/queue.php) : une tâche encore en cours n'est pas reprise une seconde fois.
[program:__INSTANCE__-queue-long]
process_name=%(program_name)s
numprocs=1
command=__PHP__ __APP_DIR__/artisan queue:work database-long --queue=long --sleep=3 --tries=3 --timeout=650 --max-time=3600
user=__USER__
environment=HOME="__HOME__"
autostart=true
autorestart=true
stopwaitsecs=660
redirect_stderr=true
stdout_logfile=__APP_DIR__/storage/logs/queue-long.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
