; Processus permanents de Jibiat Marchand (copié dans /etc/supervisor/conf.d/ par install-apache.sh).
; __INSTANCE__, __APP_DIR__, __PHP__, __USER__ et __HOME__ sont remplacés à l'installation.

; File d'attente : messages WhatsApp, API Conversions de Meta, affectation automatique des livraisons
[program:__INSTANCE__-queue]
process_name=%(program_name)s
command=__PHP__ __APP_DIR__/artisan queue:work --sleep=3 --tries=3 --max-time=3600
user=__USER__
environment=HOME="__HOME__"
autostart=true
autorestart=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=__APP_DIR__/storage/logs/queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
