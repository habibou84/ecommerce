; Groupe PHP-FPM de Jibiat Marchand (copié dans /etc/php/__PHP_V__/fpm/pool.d/ par install-apache.sh)
[jibiat-marchand]
user = __USER__
group = __USER__
listen = /run/php/php__PHP_V__-fpm-jibiat.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

php_admin_value[upload_max_filesize] = 12M
php_admin_value[post_max_size] = 12M
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 60
